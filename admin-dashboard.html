<!DOCTYPE html>
<html>
<head>
  <title>Admin Dashboard - TURAWA</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f9;
    }

    header {
      background: #0f3c6e;
      color: white;
      padding: 15px;
      text-align: center;
    }

    .container {
      padding: 20px;
    }

    .card {
      background: white;
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 15px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }

    h2 {
      color: #0f3c6e;
    }

    .btn {
      display: block;
      background: #1e88e5;
      color: white;
      text-decoration: none;
      padding: 12px;
      text-align: center;
      border-radius: 6px;
      margin-top: 10px;
      font-weight: bold;
    }

    .btn.red {
      background: #d32f2f;
    }
  </style>
</head>
<body>

<header>
  <h1>Admin Dashboard</h1>
  <p>TURAWA GLOBAL CONCEPT NIG LTD</p>
</header>

<div class="container">

  <div class="card">
    <h2>Administration Panel</h2>
    <p>Welcome Admin, manage your system below:</p>
  </div>

  <div class="card">
    <h2>Students Management</h2>
    <a class="btn" href="#">View Registrations</a>
    <a class="btn" href="#">Approve Students</a>
  </div>

  <div class="card">
    <h2>Control Panel</h2>
    <a class="btn" href="registration.html">Open Registration Page</a>
  </div>

  <div class="card">
    <h2>System</h2>
    <a class="btn red" href="index.html">Logout</a>
  </div>

</div>

</body>
</html>
